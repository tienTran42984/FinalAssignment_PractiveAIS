<h2>Enter Private Key</h2>
<form method="POST" action="/decrypt_with_key" enctype="multipart/form-data">
    <label>Enter d:</label>
    <input type="number" name="d" required><br>

    <label>Enter n:</label>
    <input type="number" name="n" required><br>

    <label>Select file to decrypt:</label>
    <input type="file" name="input_file" required><br><br>

    <button type="submit">Decrypt</button>
</form>
