<h2>Enter Public Key</h2>
<form method="POST" action="/encrypt_with_key" enctype="multipart/form-data">
    <label>Enter e:</label>
    <input type="number" name="e" required><br>

    <label>Enter n:</label>
    <input type="number" name="n" required><br>

    <label>Select file to encrypt:</label>
    <input type="file" name="input_file" required><br><br>

    <button type="submit">Encrypt</button>
</form>
